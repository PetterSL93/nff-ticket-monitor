name: NFF API Direct Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test NFF API
        run: |
          URL="https://resale.fotball.no/list/resale/resaleProductCatalog.json?"

          echo "Henter NFF API direkte..."

          HTTP_CODE=$(curl \
            --location \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            --user-agent "Mozilla/5.0" \
            --header "Accept: application/json, text/javascript, */*; q=0.01" \
            --header "Referer: https://resale.fotball.no/list/resaleProducts/?" \
            --header "X-Requested-With: XMLHttpRequest" \
            --output /tmp/nff.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP-status: $HTTP_CODE"

          echo "Content-Type:"
          file /tmp/nff.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Første 1000 tegn av responsen:"
            head -c 1000 /tmp/nff.json || true
            exit 1
          fi

          if ! jq empty /tmp/nff.json 2>/dev/null; then
            echo "Responsen er ikke gyldig JSON."
            head -c 1000 /tmp/nff.json || true
            exit 1
          fi

          echo "API returnerte gyldig JSON."

          echo "Tilgjengelige produkter:"

          jq '
            [
              .topicWithProductsList[]?.products[]?
              | {
                  name: .name,
                  venue: .venue,
                  availableQuantity: .availableQuantity
                }
            ]
          ' /tmp/nff.json
