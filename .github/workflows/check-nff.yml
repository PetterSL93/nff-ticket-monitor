name: NFF Resale Monitor

on:
  workflow_dispatch:

concurrency:
  group: nff-ticket-monitor
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v5

      - name: Sjekk NFF resale
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          URL="https://resale.fotball.no/list/resaleProducts/?lang=no"
          EMPTY_TEXT="There are currently no tickets being resold"

          echo "Henter NFF resale-side..."

          HTTP_CODE=$(curl \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 60 \
            --user-agent "Mozilla/5.0" \
            --output /tmp/nff-page.html \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP-status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "NFF returnerte HTTP $HTTP_CODE."
            exit 1
          fi

          if grep -Fqi "$EMPTY_TEXT" /tmp/nff-page.html; then
            CURRENT_STATE="empty"
            echo "Ingen resale-billetter funnet."

          elif grep -Eqi "Du er nå i køen|venterommet|waiting room|queue" /tmp/nff-page.html; then
            CURRENT_STATE="queue"
            echo "NFF viser kø/venterom. Ingen billettvarsling."

          elif grep -Eqi "[0-9]+[[:space:]]+billetter" /tmp/nff-page.html && grep -Fqi "KJØP" /tmp/nff-page.html; then
            CURRENT_STATE="available"
            echo "Mulig resale-billett funnet!"

          else
            CURRENT_STATE="unknown"
            echo "Siden er verken tom-siden, køsiden eller en kjent billettside."
            echo "Varsler ikke som billett."
          fi

          PREVIOUS_STATE=$(cat state.txt 2>/dev/null || echo "unknown")

          echo "Forrige status: $PREVIOUS_STATE"
          echo "Ny status: $CURRENT_STATE"

          if [ "$CURRENT_STATE" = "available" ] && [ "$PREVIOUS_STATE" != "available" ]; then

            MESSAGE="NFF sin resale-side viser tegn til tilgjengelige billetter. Sjekk siden med en gang."

            curl \
              --fail \
              --silent \
              --show-error \
              -H "Title: NFF resale - billetter kan være tilgjengelige!" \
              -H "Priority: urgent" \
              -H "Click: $URL" \
              -d "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"

            echo "Varsel sendt."

          elif [ "$CURRENT_STATE" = "unknown" ] && [ "$PREVIOUS_STATE" != "unknown" ]; then

            MESSAGE="NFF resale-siden ser annerledes ut enn forventet. Dette kan være billetter, en sideendring eller noe annet. Sjekk siden manuelt."

            curl \
              --fail \
              --silent \
              --show-error \
              -H "Title: NFF resale - ukjent endring" \
              -H "Priority: high" \
              -H "Click: $URL" \
              -d "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"

            echo "Unknown-varsel sendt."

          fi

          if [ "$CURRENT_STATE" != "$PREVIOUS_STATE" ]; then
            echo "$CURRENT_STATE" > state.txt

            git config user.name "NFF Ticket Monitor"
            git config user.email "actions@github.com"

            git add state.txt
            git commit -m "Update ticket state: $CURRENT_STATE"

            git pull --rebase origin main
            git push origin main

          else
            echo "Status uendret."
          fi
