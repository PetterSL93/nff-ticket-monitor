name: NFF Resale Monitor Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-nff:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Hent repository
        uses: actions/checkout@v5

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Test NFF og API
        run: |
          cat > test-nff.js <<'EOF'
          const { chromium } = require('playwright');

          const NFF_PAGE =
            'https://resale.fotball.no/list/resaleProducts/?';

          const NFF_API =
            'https://resale.fotball.no/list/resale/resaleProductCatalog.json?';

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              locale: 'nb-NO',
              viewport: {
                width: 1920,
                height: 1080
              },
              userAgent:
                'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
                'AppleWebKit/537.36 (KHTML, like Gecko) ' +
                'Chrome/153.0.0.0 Safari/537.36'
            });

            const page = await context.newPage();

            try {
              console.log('1. Åpner NFF resale-side...');

              const pageResponse = await page.goto(
                NFF_PAGE,
                {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                }
              );

              console.log(
                `NFF HTTP-status: ${
                  pageResponse?.status() ?? 'ukjent'
                }`
              );

              console.log(
                `NFF URL: ${page.url()}`
              );

              console.log(
                `NFF title: ${await page.title()}`
              );

              console.log(
                '2. Venter 10 sekunder...'
              );

              await page.waitForTimeout(10000);

              console.log(
                `URL etter venting: ${page.url()}`
              );

              console.log(
                `Title etter venting: ${await page.title()}`
              );

              console.log(
                '3. Henter API direkte med browser-context...'
              );

              const apiResponse =
                await context.request.get(
                  NFF_API,
                  {
                    headers: {
                      Accept:
                        'application/json, text/javascript, */*; q=0.01',

                      Referer:
                        NFF_PAGE,

                      'X-Requested-With':
                        'XMLHttpRequest'
                    },

                    timeout: 30000
                  }
                );

              console.log(
                `API HTTP-status: ${apiResponse.status()}`
              );

              console.log(
                `API Content-Type: ${
                  apiResponse.headers()['content-type'] || ''
                }`
              );

              const text =
                await apiResponse.text();

              console.log(
                '4. Første 1000 tegn av API-responsen:'
              );

              console.log(
                text.slice(0, 1000)
              );

              try {
                const data =
                  JSON.parse(text);

                console.log(
                  '5. API-responsen er gyldig JSON.'
                );

                console.log(
                  `resaleItems: ${
                    Array.isArray(data.resaleItems)
                      ? data.resaleItems.length
                      : 0
                  }`
                );

                for (
                  const topic of
                  (data.topicWithProductsList || [])
                ) {
                  for (
                    const product of
                    (topic.products || [])
                  ) {
                    console.log(
                      `Produkt: ${
                        product.name || 'Ukjent'
                      }`
                    );

                    console.log(
                      `availableQuantity: ${
                        product.availableQuantity
                      }`
                    );

                    console.log(
                      `venue: ${
                        product.venue || ''
                      }`
                    );
                  }
                }

              } catch {
                console.log(
                  '5. API-responsen er IKKE gyldig JSON.'
                );
              }

            } finally {
              await browser.close();
            }

          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node test-nff.js
