name: NFF API Retry Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test NFF API med flere forsøk
        run: |
          URL="https://resale.fotball.no/list/resale/resaleProductCatalog.json?"

          for attempt in 1 2 3; do
            echo "=============================="
            echo "Forsøk $attempt av 3"
            echo "=============================="

            rm -f /tmp/nff.json

            HTTP_CODE=$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --user-agent "Mozilla/5.0" \
              --header "Accept: application/json, text/javascript, */*; q=0.01" \
              --header "Referer: https://resale.fotball.no/list/resaleProducts/?" \
              --header "X-Requested-With: XMLHttpRequest" \
              --output /tmp/nff.json \
              --write-out "%{http_code}" \
              "$URL")

            echo "HTTP-status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && jq empty /tmp/nff.json 2>/dev/null; then
              echo "Fikk gyldig JSON!"

              jq '
                [
                  .topicWithProductsList[]?.products[]?
                  | {
                      name: .name,
                      venue: .venue,
                      availableQuantity: .availableQuantity
                    }
                ]
              ' /tmp/nff.json

              exit 0
            fi

            echo "Ikke gyldig katalogrespons."

            if [ -f /tmp/nff.json ]; then
              echo "Respons:"
              head -c 500 /tmp/nff.json || true
              echo
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Venter 5 sekunder..."
              sleep 5
            fi
          done

          echo "Alle tre forsøk mislyktes."
          exit 1
