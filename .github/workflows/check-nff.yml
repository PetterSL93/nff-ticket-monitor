name: NFF Resale Monitor

on:
  workflow_dispatch:

concurrency:
  group: nff-ticket-monitor
  cancel-in-progress: false
  
permissions:
  contents: write

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v5

      - name: Sjekk NFF resale
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          URL="https://resale.fotball.no/list/resale/resaleProductCatalog.json?lang=no"

          echo "Henter NFF resale-API..."

          HTTP_CODE=$(curl \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 60 \
            --user-agent "Mozilla/5.0" \
            --header "Accept: application/json" \
            --output /tmp/nff-resale.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP-status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "NFF API returnerte HTTP $HTTP_CODE."
            exit 1
          fi

          if ! jq empty /tmp/nff-resale.json 2>/dev/null; then
            echo "Responsen er ikke gyldig JSON."
            echo "DEBUG: content-type:"
            file /tmp/nff-resale.json

            echo "DEBUG: første 1000 tegn av API-responsen:"
            head -c 1000 /tmp/nff-resale.json || true

            echo
            echo "DEBUG: størrelse:"
            wc -c /tmp/nff-resale.json

            exit 1
          fi



          AVAILABLE_QUANTITY=$(jq '
            [
              .topicWithProductsList[]?.products[]?.availableQuantity
              | select(type == "number")
            ]
            | add // 0
          ' /tmp/nff-resale.json)

          RESALE_ITEMS=$(jq '
            (.resaleItems // [])
            | length
          ' /tmp/nff-resale.json)

          echo "Tilgjengelig antall: $AVAILABLE_QUANTITY"
          echo "Antall resale-items: $RESALE_ITEMS"

          if [ "$AVAILABLE_QUANTITY" -gt 0 ] || [ "$RESALE_ITEMS" -gt 0 ]; then
            CURRENT_STATE="available"
            echo "MULIG RESALE-BILLETT FUNNET!"

          else
            CURRENT_STATE="empty"
            echo "Ingen resale-billetter tilgjengelig."
          fi

          PREVIOUS_STATE=$(cat state.txt 2>/dev/null || echo "unknown")

          echo "Forrige status: $PREVIOUS_STATE"
          echo "Ny status: $CURRENT_STATE"

          if [ "$CURRENT_STATE" = "available" ] && [ "$PREVIOUS_STATE" != "available" ]; then

            MESSAGE="NFF sin resale-side viser tegn til tilgjengelige billetter. Sjekk siden med en gang."

            curl \
              --fail \
              --silent \
              --show-error \
              -H "Title: NFF resale - billetter kan være tilgjengelige!" \
              -H "Priority: urgent" \
              -H "Click: $URL" \
              -d "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"

            echo "Varsel sendt."

          elif [ "$CURRENT_STATE" = "unknown" ] && [ "$PREVIOUS_STATE" != "unknown" ]; then

            MESSAGE="NFF resale-siden ser annerledes ut enn forventet. Dette kan være billetter, en sideendring eller noe annet. Sjekk siden manuelt."

            curl \
              --fail \
              --silent \
              --show-error \
              -H "Title: NFF resale - ukjent endring" \
              -H "Priority: high" \
              -H "Click: $URL" \
              -d "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"

            echo "Unknown-varsel sendt."

          fi

          if [ "$CURRENT_STATE" != "$PREVIOUS_STATE" ]; then
            echo "$CURRENT_STATE" > state.txt

            git config user.name "NFF Ticket Monitor"
            git config user.email "actions@github.com"

            git add state.txt
            git commit -m "Update ticket state: $CURRENT_STATE"

            git pull --rebase origin main
            git push origin main

          else
            echo "Status uendret."
          fi
